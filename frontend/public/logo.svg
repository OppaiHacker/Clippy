<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Clippy: a play button built from four audio tracks (system, app, device, mic) -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22203a"/>
      <stop offset="1" stop-color="#111118"/>
    </linearGradient>
    <radialGradient id="glow" cx=".3" cy=".2" r=".9">
      <stop offset="0" stop-color="#8470ff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#8470ff" stop-opacity="0"/>
    </radialGradient>
    <mask id="play">
      <path d="M12 9 L24 16 L12 23 Z" fill="#fff" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>
    </mask>
  </defs>
  <rect width="32" height="32" rx="9" fill="url(#tile)"/>
  <rect width="32" height="32" rx="9" fill="url(#glow)"/>
  <rect x=".5" y=".5" width="31" height="31" rx="8.5" fill="none" stroke="#fff" stroke-opacity=".1"/>
  <g mask="url(#play)">
    <rect x="8" y="7.5" width="20" height="3.05" fill="#4da3ff"/>
    <rect x="8" y="12.15" width="20" height="3.05" fill="#a78bfa"/>
    <rect x="8" y="16.8" width="20" height="3.05" fill="#3ddc97"/>
    <rect x="8" y="21.45" width="20" height="3.05" fill="#ff4d6d"/>
  </g>
</svg>
