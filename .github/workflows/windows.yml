name: windows

on:
  push:
    branches: [windows]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write  # release upload on tags

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
      - name: Build frontend
        working-directory: frontend
        run: bun install --frozen-lockfile && bun run build

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --group build

      - name: ffmpeg into bin/ (bundled with the exe, and on PATH for the tests)
        run: |
          mkdir bin
          curl -fL -o ffmpeg.zip https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-win64-gpl-8.1.zip
          7z x ffmpeg.zip -offmpeg-extract
          cp ffmpeg-extract/*/bin/ffmpeg.exe ffmpeg-extract/*/bin/ffprobe.exe bin/
          bin/ffmpeg.exe -hide_banner -encoders | grep -E "h264_nvenc|h264_amf|h264_qsv|libopus"
          bin/ffmpeg.exe -hide_banner -filters | grep ddagrab
          cygpath -w "$PWD/bin" >> "$GITHUB_PATH"  # a /d/a/... path means nothing to Windows Python

      - name: Tests
        run: |
          # failures as annotations: those are readable without access to the job log
          set +eo pipefail  # Actions runs bash with -eo pipefail, which would exit before the tail below
          uv run pytest -q -rfE --tb=line 2>&1 | tee pytest.log; rc=${PIPESTATUS[0]}
          [[ $rc == 0 ]] || { tail -n 40 pytest.log | sed 's/^/::error::/'; exit $rc; }

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - run: cargo build --release --manifest-path native/clippy-audio/Cargo.toml

      - name: Add clippy-audio to bin/
        run: cp native/clippy-audio/target/release/clippy-audio.exe bin/

      - name: Build exe
        run: |
          uv run pyinstaller --noconfirm packaging/windows/clippy.spec

      - name: Smoke test
        shell: pwsh
        env:
          WORK_DIR: ${{ runner.temp }}\clippy-smoke
          CLIPS_DIR: ${{ runner.temp }}\clippy-smoke\clips
        run: |
          $p = Start-Process dist\Clippy\Clippy.exe -ArgumentList "--smoke" -Wait -PassThru
          Get-Content "$env:WORK_DIR\clippy.log" -Tail 30
          exit $p.ExitCode

      - name: Build installer
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF_TYPE" == tag ]] || VERSION="0.0.0-${GITHUB_SHA::7}"
          ISCC="C:/Program Files (x86)/Inno Setup 6/ISCC.exe"
          [[ -f "$ISCC" ]] || { choco install innosetup -y --no-progress; }
          set +eo pipefail
          # MSYS would rewrite /DAppVersion=... into a path
          MSYS_NO_PATHCONV=1 "$ISCC" /DAppVersion="$VERSION" packaging/windows/clippy.iss > iscc.log 2>&1; rc=$?
          cat iscc.log
          [[ $rc == 0 ]] || { tail -n 25 iscc.log | sed 's/^/::error::/'; exit $rc; }

      - name: Installer screenshots
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          New-Item -ItemType Directory screenshots | Out-Null
          $setup = Start-Process (Get-ChildItem dist\ClippySetup-*.exe).FullName -PassThru
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          foreach ($i in 1..4) {
            Start-Sleep 4
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("screenshots\page$i.png")
            (New-Object -ComObject WScript.Shell).AppActivate($setup.Id) | Out-Null
            [System.Windows.Forms.SendKeys]::SendWait("{ENTER}")
          }
          Stop-Process $setup -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v4
        with:
          name: installer-screenshots
          path: screenshots/

      - uses: actions/upload-artifact@v4
        with:
          name: ClippySetup
          path: dist/ClippySetup-*.exe

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: dist/ClippySetup-*.exe
